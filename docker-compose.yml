# this is the docker compose file that was run on our coolify server to host solr with multiple default cores
services:
  solr:
    image: solr:latest
    container_name: solr-multiple-cores
    restart: always
    ports:
      - "8983:8983"
    environment:
      - SOLR_JAVA_MEM=-Xms512m -Xmx512m
    volumes:
      - solr_data:/var/solr
    # We override the default command to create multiple cores at startup to prepare the environment to host multiple datasets
    command:
      - bash
      - "-c"
      - "precreate-core small; precreate-core medium; precreate-core big; exec solr -f"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/info/system"]
      interval: 30s
      timeout: 10s
      retries: 5
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  solr_data:
    name: solr_data
  qdrant_storage:
    name: qdrant_storage
  pgdata:
    name: pgdata