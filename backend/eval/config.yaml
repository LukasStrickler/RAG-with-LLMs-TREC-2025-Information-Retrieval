# Evaluation CLI Configuration
# API settings are loaded from backend/eval/.env
# See .env for API_BASE_URL, API_KEY, API_TIMEOUT, etc.
api:
  timeout: 10800  # 3 hours for large batch requests with reranking (700 queries × 100 segments with reranking can take 2+ hours)
  max_retries: 3
  concurrency: 5

retrieval:
  modes: [lexical, vector, hybrid]
  default_mode: hybrid
  top_k: 100

paths:
  # Absolute path to project root (auto-detected)
  project_root: null
  
  # Data directory (relative to project root)
  data_dir: ".data/trec_rag_assets"
  
  # Output directory (relative to project root)
  output_dir: "backend/eval/artifacts"
  
  # Topic files (relative to data_dir)
  topics:
    rag23: "topics.dl23.txt"  # Default: TREC DL 2023
    rag24: "topics.rag24.test.txt"
    dl21: "topics.dl21.txt"
    dl22: "topics.dl22.txt"
    dl22: "topics.dl22.txt"
    dl23: "topics.dl23.txt"
    msmarco-dev: "topics.msmarco-v2-doc.dev.txt"
    msmarco-dev: "topics.msmarco-v2-doc.dev.txt"
    msmarco-dev2: "topics.msmarco-v2-doc.dev2.txt"
    rag25: "trec_rag_2025_queries.jsonl"
  
  # Qrels files (relative to data_dir)
  qrels:
    rag23: "qrels.dl23-doc-msmarco-v2.1.txt"  # Default: TREC DL 2023
    rag24: "qrels.rag24.test-umbrela-all.txt"
    dl21: "qrels.dl21-doc-msmarco-v2.1.txt"
    dl22: "qrels.dl22-doc-msmarco-v2.1.txt"
    dl22: "qrels.dl22-doc-msmarco-v2.1.txt"
    dl23: "qrels.dl23-doc-msmarco-v2.1.txt"
    msmarco-dev: "qrels.msmarco-v2.1-doc.dev.txt"
    msmarco-dev: "qrels.msmarco-v2.1-doc.dev.txt"
    msmarco-dev2: "qrels.msmarco-v2.1-doc.dev2.txt"
    rag25: null  # Organizer qrels pending; CLI guards and prompts for override
  
  # Baseline runs (relative to data_dir)
  baselines:
    # rag23: "fs4_bm25+rocchio_snowael_snowaem_gtel+monot5_rrf+rz_rrf.rag24.test.txt"
    rag24: "fs4_bm25+rocchio_snowael_snowaem_gtel+monot5_rrf+rz_rrf.rag24.test.txt"
    rag25: "run.rankqwen3_32b.rag25.txt"

metrics:
  primary: "ndcg_cut_10"
  cutoffs: [10, 25, 50, 100]
  # Targets based on TREC 2023 Deep Learning Track (DL23) document ranking published results:
  # Reference: Craswell et al. (2023). Overview of the TREC 2023 Deep Learning Track.
  # https://trec.nist.gov/pubs/trec32/papers/Overview_deep.pdf
  # 
  # Document Ranking Results (Table 3):
  # - BM25 baseline (D_bm25_splades): nDCG@10=0.494, nDCG@100=0.515, AP=0.298
  # - Best performer (D_naverloo-frgpt4): nDCG@10=0.689, nDCG@100=0.635, AP=0.419
  # - Second best (D_naverloo_bm_splade_RR): nDCG@10=0.596, AP=0.379
  #
  # Recall targets from competitive benchmarks (DGR on TREC DL 2019):
  # - Recall@20=0.676, Recall@100=0.865 (similar track, used as reference)
  # 
  # Targets set as competitive goals between baseline and best performer
  targets:
    ndcg_cut_10: 0.60      # Baseline: 0.494, best: 0.689 (target: competitive)
    ndcg_cut_25: 0.58      # Estimated from nDCG@10 pattern
    ndcg_cut_50: 0.56      # Estimated from nDCG@10 pattern
    ndcg_cut_100: 0.54     # Baseline: 0.515, best: 0.635 (target: competitive)
    map_cut_100: 0.35      # Baseline: 0.298, best: 0.419 (target: competitive)
    recip_rank: 0.65       # Competitive target (no explicit DL23 document ranking MRR reported)
    recall_25: 0.70        # Competitive: DGR Recall@20=0.676, interpolated for @25
    recall_50: 0.78        # Competitive: Interpolated between Recall@25 and @100
    recall_100: 0.85       # Competitive: DGR Recall@100=0.865 (slightly conservative)
    hitrate_10: 0.75       # Competitive target (BM25 typically achieves ~0.70-0.75)
  # Custom metrics are computed via post-processing (not by trec_eval binary)
  # These metrics are calculated separately from trec_eval metrics
  custom:
    - "hitrate_10"  # Binary success in top 10 - computed from run file and qrels

trec_eval:
  binary_path: "trec_eval"
  flags: ["-c"]
  # Metrics computed by trec_eval binary (standard IR metrics)
  # Note: Custom metrics like hitrate_10 are computed separately via post-processing
  metrics:
    - "ndcg_cut.10"
    - "ndcg_cut.25"
    - "ndcg_cut.50"
    - "ndcg_cut.100"
    - "map_cut.100"
    - "recip_rank"
    - "recall.25"
    - "recall.50"
    - "recall.50"
    - "recall.100"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

