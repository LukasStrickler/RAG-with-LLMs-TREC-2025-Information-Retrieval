# Docker Compose for RAG System with TREC 2025 Information Retrieval
# 
# IMPORTANT: Before first run, initialize storage from backups:
#   ./scripts/setup.sh          (recommended - runs init + starts services)
#   OR
#   ./scripts/init-storage.sh   (just initializes storage)
#
# This will combine split backup files and extract to:
#   - ./images/solr_data_backup (5.2GB - 1.6M MS MARCO docs, BM25 indexed)
#   - ./images/qdrant_data_backup (6.3GB - vector embeddings)
#
services:
  solr:
    image: solr:latest
    container_name: solr-multiple-cores
    restart: always
    ports:
      - "8983:8983"
    environment:
      - SOLR_JAVA_MEM=-Xms512m -Xmx512m
    volumes:
      - ./images/solr_data_backup:/var/solr
    # We override the default command to create multiple cores at startup to prepare the environment to host multiple datasets
    command:
      - bash
      - "-c"
      - "precreate-core small; precreate-core medium; precreate-core big; exec solr -f"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/admin/info/system"]
      interval: 30s
      timeout: 10s
      retries: 5
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./images/qdrant_data_backup:/qdrant/storage
  postgres:
    image: postgres:latest
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Solr and Qdrant use local directory mounts (see volumes above)
  # PostgreSQL uses a named volume for persistence
  pgdata:
    name: pgdata